<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day 🌹</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
  height:100vh;
  background:radial-gradient(circle at top,#3a1c2b,#0d0508);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

.floating span{
  position:absolute;
  bottom:-40px;
  font-size:18px;
  opacity:.6;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  from{transform:translateY(0)}
  to{transform:translateY(-110vh)}
}

.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(10px);
  padding:28px;
  border-radius:18px;
  width:320px;
  text-align:center;
  box-shadow:0 0 35px rgba(255,120,150,.3);
  z-index:2;
}

.rose{
  width:90px;height:90px;
  border-radius:50%;
  background:radial-gradient(circle,#ff8fb1,#c43d6f);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;margin:0 auto 16px;
}

h1{
  color:#ffb3c7;
  margin-bottom:18px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:14px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

.yes{background:#ff6f9c;color:white}
.no{background:#222;color:#ccc}

.note{
  margin-top:12px;
  font-size:13px;
  color:#ffb3c7;
  display:none;
}
</style>
</head>

<body>

<div class="floating">
  <span style="left:10%;animation-duration:14s">🌹</span>
  <span style="left:30%;animation-duration:18s">🌸</span>
  <span style="left:55%;animation-duration:12s">🌹</span>
  <span style="left:75%;animation-duration:16s">💕</span>
</div>

<div class="card">
  <div class="rose">🌹</div>
  <h1>Happy Rose Day, Hetsi 🌹</h1>

  <div class="buttons">
    <button class="yes" onclick="goNext()">Yes 🌹</button>
    <button class="no" onclick="ask()">No</button>
  </div>

  <div class="note" id="note">Please take… just one 🌹</div>
</div>

<script>
function ask(){
  document.getElementById("note").style.display="block";
}
function goNext(){
  window.location.href="rose.html";
}
</script>

</body>
</html>
